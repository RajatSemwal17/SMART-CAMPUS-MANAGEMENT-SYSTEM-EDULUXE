    <section class="contact">
      <h1>Contact Us</h1>
      <p>Feel free to reach out using the form below or through my social links.</p>
      
      <form class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
        <button type="submit" class="sendMessage">Send Message</button>
      </form>
      
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
  // emailjs

  (function(){
    emailjs.init("D149Njr2_ayEeVQPt"); // ✅ Put Public Key here
  })();

  const form = document.querySelector(".contact-form");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const name = form.name.value;
    const email = form.email.value;
    const message = form.message.value;

    emailjs.send("service_70co46l", "template_g2dsaq6", { // ✅ Service & Template IDs here
      from_name: name,
      reply_to: email,
      message: message
    })
    .then(() => {
      alert("Message Sent Successfully!");
      form.reset();
    }, (error) => {
      alert("Failed to send message! Try again.");
      console.log(error);
    });
  });
</script>


    <script>
